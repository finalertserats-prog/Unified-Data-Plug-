services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: udp-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - udp_minio_data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    container_name: udp-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set udp http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p udp/$$MINIO_BUCKET || true;
      mc anonymous set none udp/$$MINIO_BUCKET || true;
      echo 'MinIO bucket ready';
      "

  postgres:
    image: postgres:16-alpine@sha256:890480b08124ce7f79960a9bb16fe39729aa302bd384bfd7c408fee6c8f7adb7
    container_name: udp-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
    volumes:
      - udp_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iceberg} -d ${POSTGRES_DB:-iceberg_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 20

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0@sha256:3b7d31bdfec626b68e97531c9778a1b9119659e456fe28545a49f6aa6a9ce472
    container_name: udp-iceberg-rest
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8181:8181"
    env_file:
      - .env
    environment:
      # JDBC-backed catalog (durable across container restarts).
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iceberg_catalog}
      CATALOG_JDBC_USER: ${POSTGRES_USER:-iceberg}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      # tabulario/iceberg-rest:1.6.0 ships no wget/curl/nc — use bash /dev/tcp
      # to confirm the port is accepting connections. Iceberg REST opens the
      # listener only after JdbcCatalog init succeeds, so port-open == ready.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8181"]
      interval: 10s
      timeout: 5s
      retries: 30

  spark:
    # Note: 3.5.1_1.5.2 does not exist on Docker Hub; pinned to 3.5.1_1.5.0 (closest existing).
    image: tabulario/spark-iceberg:3.5.1_1.5.0@sha256:36e14e051124a256ca88baaeaf41a8d1457a67e806213d3587f64054e8cc4efa
    container_name: udp-spark
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ./jobs:/home/iceberg/jobs
      - ./examples:/home/iceberg/examples
      - ./udp_core:/home/iceberg/udp_core:ro
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3-latest@sha256:2ef2ef7545b0cd852bcb6e1f1ba0921b630be48b3517ce5422cc83aa490bafd9
    container_name: udp-starrocks-fe
    hostname: starrocks-fe
    env_file:
      - .env
    command:
      - /bin/bash
      - -c
      - |
        # Use the container hostname (starrocks-fe) for FE identity instead
        # of the bridge-assigned IP. Without this, the FE persists
        # "name=<ip>_9010_..." in meta/image/ROLE and refuses to start when
        # the container IP changes across restarts (which it does on Docker
        # bridge networks). FQDN mode keeps the identity stable.
        if ! grep -q '^enable_fqdn_mode' /opt/starrocks/fe/conf/fe.conf; then
          echo "enable_fqdn_mode = true" >> /opt/starrocks/fe/conf/fe.conf
        fi
        /opt/starrocks/fe/bin/start_fe.sh --daemon
        until mysql -h 127.0.0.1 -P 9030 -u root \
          ${STARROCKS_ROOT_PASSWORD:+-p$$STARROCKS_ROOT_PASSWORD} \
          -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        sleep infinity
    ports:
      - "127.0.0.1:8030:8030"
      - "127.0.0.1:9020:9020"
      - "127.0.0.1:9030:9030"
    volumes:
      - udp_starrocks_fe_meta:/opt/starrocks/fe/meta
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      # FE healthcheck handles BOTH auth states:
      #   - on first boot, root has no password → try without -p
      #   - after set-starrocks-password.sh runs → try with -p$STARROCKS_ROOT_PASSWORD
      # The previous version always passed -p, which failed before the password
      # was applied (chicken-and-egg: FE never went healthy → install hung).
      test:
        - "CMD-SHELL"
        - "mysql -h 127.0.0.1 -P 9030 -u root -e 'SELECT 1' >/dev/null 2>&1 || mysql -h 127.0.0.1 -P 9030 -u root -p\"$$STARROCKS_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 40

  starrocks-be:
    image: starrocks/be-ubuntu:3.3-latest@sha256:d848b975626cc52be579a3c20f35ed4af2e0325a2a38d4c916f980469d58c088
    container_name: udp-starrocks-be
    hostname: starrocks-be
    depends_on:
      starrocks-fe:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        echo "priority_networks = 172.16.0.0/12" >> /opt/starrocks/be/conf/be.conf
        /opt/starrocks/be/bin/start_be.sh --daemon
        sleep infinity
    ports:
      - "127.0.0.1:8040:8040"
      - "127.0.0.1:8060:8060"
      - "127.0.0.1:9050:9050"
      - "127.0.0.1:9060:9060"
    volumes:
      - udp_starrocks_be_storage:/opt/starrocks/be/storage
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: udp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - udp_prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    container_name: udp-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - udp_grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-init:
    image: apache/airflow:2.10.3-python3.11@sha256:51565d1fbd612e0d759f3ff5b0c38d56130aae15282a753c19aba98a179fc3b5
    container_name: udp-airflow-init
    profiles: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-iceberg}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB:-airflow_meta}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/udp_lib:/opt/airflow/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "docker==7.1.0"
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_meta}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@udp.local}
    volumes:
      - ./scripts/airflow-init.sh:/opt/airflow/init.sh:ro
    user: "0:0"
    entrypoint: /bin/bash
    # Mount is :ro so we cannot chmod +x — invoke via `bash <path>` which
    # doesn't need the executable bit. apt-get installs postgresql-client
    # for the psql calls the init script makes against udp-postgres.
    command: -c "apt-get update >/dev/null && apt-get install -y --no-install-recommends postgresql-client >/dev/null && su airflow -c 'bash /opt/airflow/init.sh'"

  airflow-webserver:
    image: apache/airflow:2.10.3-python3.11@sha256:51565d1fbd612e0d759f3ff5b0c38d56130aae15282a753c19aba98a179fc3b5
    container_name: udp-airflow-webserver
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-iceberg}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB:-airflow_meta}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
      _PIP_ADDITIONAL_REQUIREMENTS: "docker==7.1.0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      # udp_core is mounted to a top-level path (not under dags/) to avoid
      # the Docker Desktop overlayfs "mkdirat: read-only file system" error
      # when trying to create a subdir inside the image's pre-baked dags/.
      # PYTHONPATH below makes it importable from the DAGs.
      - ./udp_core:/opt/udp_lib/udp_core:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - udp_airflow_logs:/opt/airflow/logs
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health | grep -q '\"healthy\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.3-python3.11@sha256:51565d1fbd612e0d759f3ff5b0c38d56130aae15282a753c19aba98a179fc3b5
    container_name: udp-airflow-scheduler
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-iceberg}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB:-airflow_meta}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/udp_lib:/opt/airflow/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "docker==7.1.0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      # udp_core is mounted to a top-level path (not under dags/) to avoid
      # the Docker Desktop overlayfs "mkdirat: read-only file system" error
      # when trying to create a subdir inside the image's pre-baked dags/.
      # PYTHONPATH below makes it importable from the DAGs.
      - ./udp_core:/opt/udp_lib/udp_core:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - udp_airflow_logs:/opt/airflow/logs
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    command: scheduler

  dagster:
    image: python:3.11-slim@sha256:9a7765b36773a37061455b332f18e265e7f58f6fea9c419a550d2a8b0e9db834
    container_name: udp-dagster
    profiles: ["dagster"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_USERNAME: ${POSTGRES_USER:-iceberg}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_HOSTNAME: postgres
      DAGSTER_PG_DB: ${DAGSTER_DB:-dagster_meta}
      PYTHONPATH: /opt/dagster
    volumes:
      - ./dagster_project:/opt/dagster/dagster_project:ro
      - ./udp_core:/opt/dagster/udp_core:ro
      - ./config/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./scripts/dagster-entrypoint.sh:/opt/dagster/entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - udp_dagster_home:/opt/dagster/dagster_home
    ports:
      - "127.0.0.1:3001:3000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/server_info > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    command: ["bash", "/opt/dagster/entrypoint.sh"]

volumes:
  udp_minio_data:
  udp_postgres_data:
  udp_starrocks_fe_meta:
  udp_starrocks_be_storage:
  udp_prometheus_data:
  udp_grafana_data:
  udp_airflow_logs:
  udp_dagster_home:
