services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: udp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - udp_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: udp-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set udp http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p udp/$$MINIO_BUCKET || true;
      mc anonymous set none udp/$$MINIO_BUCKET || true;
      echo 'MinIO bucket ready';
      "

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: udp-iceberg-rest
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    env_file:
      - .env
    environment:
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/v1/config"]
      interval: 10s
      timeout: 5s
      retries: 30

  spark:
    image: tabulario/spark-iceberg:3.5.1_1.5.2
    container_name: udp-spark
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - "8888:8888"
      - "4040:4040"
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ./jobs:/home/iceberg/jobs
      - ./examples:/home/iceberg/examples
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3-latest
    container_name: udp-starrocks-fe
    hostname: starrocks-fe
    command:
      - /bin/bash
      - -c
      - |
        /opt/starrocks/fe/bin/start_fe.sh --daemon
        until mysql -h 127.0.0.1 -P 9030 -u root -e "SELECT 1" >/dev/null 2>&1; do sleep 2; done
        sleep infinity
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    volumes:
      - udp_starrocks_fe_meta:/opt/starrocks/fe/meta
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 40

  starrocks-be:
    image: starrocks/be-ubuntu:3.3-latest
    container_name: udp-starrocks-be
    hostname: starrocks-be
    depends_on:
      starrocks-fe:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        echo "priority_networks = 172.16.0.0/12" >> /opt/starrocks/be/conf/be.conf
        /opt/starrocks/be/bin/start_be.sh --daemon
        sleep infinity
    ports:
      - "8040:8040"
      - "8060:8060"
      - "9050:9050"
      - "9060:9060"
    volumes:
      - udp_starrocks_be_storage:/opt/starrocks/be/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8040/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  udp_minio_data:
  udp_starrocks_fe_meta:
  udp_starrocks_be_storage:
