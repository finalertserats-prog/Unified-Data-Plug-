version: 1
name: demo_sales_model
description: UDP demo semantic model for customer order analytics

tables:
  - name: customer_summary
    physical_table: app_analytics.demo_customer_summary
    dimensions:
      - name: region
        type: string
        description: Customer region
    metrics:
      - name: customer_count
        expression: SUM(customer_count)
        description: Number of customers by region
      - name: total_order_amount
        expression: SUM(total_order_amount)
        description: Total order value by region

natural_language_examples:
  - question: Show customer count by region
    sql: SELECT region, SUM(customer_count) FROM app_analytics.demo_customer_summary GROUP BY region
  - question: Which region has the highest order amount?
    sql: SELECT region, SUM(total_order_amount) FROM app_analytics.demo_customer_summary GROUP BY region ORDER BY 2 DESC LIMIT 1
