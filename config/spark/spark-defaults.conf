spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Primary catalog: REST-backed Iceberg. Default because the REST gateway
# (iceberg-rest service) is always-on; hive-metastore is now opt-in via
# the `hms` compose profile. Bootstrap + smoke jobs reference `udp` and
# work out-of-the-box without needing the HMS profile.
spark.sql.catalog.udp=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.udp.type=rest
spark.sql.catalog.udp.uri=http://iceberg-rest:8181
spark.sql.catalog.udp.warehouse=s3://datalake/warehouse
spark.sql.catalog.udp.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.udp.s3.endpoint=http://minio:9000
spark.sql.catalog.udp.s3.path-style-access=true

# Secondary catalog: HMS-backed (deck-aligned, Ranger-ready). Only resolves
# if you started the stack with `--profile hms` to bring up hive-metastore.
spark.sql.catalog.udp_hms=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.udp_hms.type=hive
spark.sql.catalog.udp_hms.uri=thrift://hive-metastore:9083
spark.sql.catalog.udp_hms.warehouse=s3a://datalake/warehouse
spark.sql.catalog.udp_hms.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.udp_hms.s3.endpoint=http://minio:9000
spark.sql.catalog.udp_hms.s3.path-style-access=true

# Backward-compat alias: pre-PR users referenced the REST catalog as `udp_rest`.
# Keep the name so existing notebooks keep working.
spark.sql.catalog.udp_rest=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.udp_rest.type=rest
spark.sql.catalog.udp_rest.uri=http://iceberg-rest:8181
spark.sql.catalog.udp_rest.warehouse=s3://datalake/warehouse
spark.sql.catalog.udp_rest.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.udp_rest.s3.endpoint=http://minio:9000
spark.sql.catalog.udp_rest.s3.path-style-access=true

spark.sql.defaultCatalog=udp
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=admin
spark.hadoop.fs.s3a.secret.key=udp_admin_12345
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
