global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    udp_env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # MinIO exposes Prometheus metrics on /minio/v2/metrics/cluster.
  # Requires MINIO_PROMETHEUS_AUTH_TYPE=public on the MinIO service (set below).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # StarRocks FE metrics — exposed on FE HTTP port 8030 path /metrics.
  - job_name: starrocks_fe
    metrics_path: /metrics
    static_configs:
      - targets: ['starrocks-fe:8030']

  # StarRocks BE metrics — exposed on BE HTTP port 8040 path /metrics.
  - job_name: starrocks_be
    metrics_path: /metrics
    static_configs:
      - targets: ['starrocks-be:8040']

  # Postgres metrics require postgres_exporter sidecar (Phase 6+). Stub:
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
