name: Validate UDP Package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts are present
        run: |
          test -f install.sh
          test -f udp
          test -f docker-compose.yml
          test -f jobs/bootstrap_demo_lake.py
          test -f sql/starrocks/00_create_iceberg_catalog.sql.template
          test -f config/spark/spark-defaults.conf.template
      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path('.').rglob('*.yaml'):
              yaml.safe_load(path.read_text())
              print('OK', path)
          PY
      - name: docker compose config lint
        run: |
          # Use a placeholder .env so interpolation succeeds. Real values come from install.sh.
          cp .env.example .env
          docker compose config --quiet
          rm .env

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-rendered-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block rendered template artifacts
        run: |
          if [ -f config/spark/spark-defaults.conf ] || \
             [ -f sql/starrocks/00_create_iceberg_catalog.sql ] || \
             [ -f sql/starrocks/02_create_users.sql ]; then
            echo "ERROR: rendered template found in repo. These are gitignored." >&2
            exit 1
          fi

  pinned-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every image to be digest-pinned
        run: |
          # Every `image:` line in compose must contain @sha256:
          unpinned=$(grep -E '^\s*image:\s+' docker-compose.yml | grep -v '@sha256:' || true)
          if [ -n "$unpinned" ]; then
            echo "ERROR: unpinned images in docker-compose.yml:" >&2
            echo "$unpinned" >&2
            exit 1
          fi
          echo "All compose images are digest-pinned."

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — misconfig scan (Dockerfile/Compose/IaC)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  dag-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Airflow + provider
        run: |
          python -m pip install --upgrade pip
          # Constraints file pins the exact Airflow dep tree for 2.10.3+py3.11.
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt"
          pip install "apache-airflow==2.10.3" docker==7.1.0 --constraint "$CONSTRAINTS"
      - name: Import every DAG via DagBag
        run: |
          python - <<'PY'
          import sys
          from airflow.models import DagBag
          bag = DagBag(dag_folder="airflow/dags", include_examples=False)
          if bag.import_errors:
              print("DAG import errors:")
              for path, err in bag.import_errors.items():
                  print(f"  {path}: {err}")
              sys.exit(1)
          print(f"Loaded {len(bag.dags)} DAGs: {sorted(bag.dags)}")
          PY

  dagster-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dagster
        run: |
          python -m pip install --upgrade pip
          pip install "dagster==1.9.0" "dagster-webserver==1.9.0" "docker==7.1.0" "pyyaml==6.0.2"
      - name: Load Definitions
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from dagster_project.definitions import defs
          assets = list(defs.get_asset_graph().asset_dep_graph["upstream"])
          print(f"Loaded {len(assets)} asset(s):", assets)
          jobs = [j.name for j in defs.get_all_job_defs()]
          print(f"Loaded {len(jobs)} job(s):", jobs)
          schedules = [s.name for s in defs.schedules or []]
          print(f"Loaded {len(schedules)} schedule(s):", schedules)
          PY

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff
      - name: ruff lint
        run: ruff check udp_core tests
      - name: pytest
        run: pytest -ra

  integration-smoke:
    runs-on: ubuntu-latest
    # NOTE: the compose stack budgets ~13.5GB of memory across services.
    # The standard ubuntu-latest runner has ~7GB — StarRocks BE in particular
    # will likely OOM. This job is therefore gated to workflow_dispatch only.
    # Run it manually from the Actions tab, or move to a larger runner
    # (e.g. ubuntu-latest-16-core or a self-hosted runner) before enabling
    # on pull_request / push.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Bring up stack non-interactively
        run: |
          # Feed defaults to install.sh's prompts via heredoc; secrets are
          # generated by the script and never need to appear in the YAML.
          printf '\n\n\n\n\n\n\n\n\n' | bash install.sh
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Capture container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200 || true
      - name: Tear down
        if: always()
        run: |
          echo "wipe" | bash udp clean || true

  trivy-images:
    runs-on: ubuntu-latest
    # Image scan is heavy; only run on PR + main branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - minio/minio:RELEASE.2025-04-22T22-12-26Z
          - tabulario/iceberg-rest:1.6.0
          - tabulario/spark-iceberg:3.5.1_1.5.0
          - starrocks/fe-ubuntu:3.3-latest
          - starrocks/be-ubuntu:3.3-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — image vuln scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL
          exit-code: '0'  # report only; do not fail build on upstream image CVEs (yet)
          ignore-unfixed: true
          format: table
